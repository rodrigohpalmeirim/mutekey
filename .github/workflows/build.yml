name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Cross-compiles like local development does: MinGW provides the linker and windres.
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --release --target x86_64-pc-windows-gnu -- -D warnings

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Checksum
        working-directory: target/x86_64-pc-windows-gnu/release
        run: sha256sum mutekey.exe | tee mutekey.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mutekey
          path: |
            target/x86_64-pc-windows-gnu/release/mutekey.exe
            target/x86_64-pc-windows-gnu/release/mutekey.exe.sha256
          if-no-files-found: error

  # A pushed v* tag publishes a release; the annotated tag's message becomes the notes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # so the tag's annotation is available
      - run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          name: mutekey
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mutekey.exe dist/mutekey.exe.sha256 \
            --title "mutekey $GITHUB_REF_NAME" --notes-from-tag --verify-tag
